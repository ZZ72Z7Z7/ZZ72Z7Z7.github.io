  **Prima settimana**: da lunedì 8 a venerdì 1, dalle 9:30 alle 17:00  
  *Sabato 13 e domenica 14: giorni di riposo*  
  **Seconda settimana**: da lunedì 15 a venerdì 19: dalle 9:30 alle 17:00  
  *Sabato 20 e domenica 21: giorni di riposo*  
  **Terza settimana**: da lunedì 22 a mercoledì 24: dalle 9:30 alle 17:00  
  Giovedì 25: dalle 12:00 alle 22:00.  
  19:00: **PRIMA PERFORMANCE PUBBLICA** di una presentazione di lavoro in corso.  
  Venerdì 26: dalle 9:30 alle 17:00  
  *Sabato 27 e domenica 28: giorni di riposo*  
  **Quarta settimana**: da lunedì 1° a mercoledì 3: dalle 9:30 alle 17:00  
  Giovedì 4, venerdì 5 e sabato 6: dalle 12:00 alle 22:00. **PERFORMANCE PUBBLICHE** dei pezzi sviluppati a partire dal primo lavoro in corso.

  Domenica 7 dalle 11:00 alle 22:00: giornata di conclusione e festa finale  

