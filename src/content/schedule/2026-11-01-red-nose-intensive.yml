tuition: |
  Workshop tuition is <strong>EURO 2.200→ 2.700</strong>

  The tuition is following a **sliding scale** approach. The sliding scale wants to acknowledge the fact that the “value” of money can change widely depending of many factors. Participants from different countries and with different backgrounds, may have different access to income or to financial support. In a highly international training, different participants will also have very different travel costs.

  If you can and want to pay on the higher end of the scale, you will be supporting the collective field of practice and the social and cultural diversity of the class, as well as funding Helikos School and Giovanni’s ongoing pedagogic research. Please indicate in your application the amount that you choose to pay.

  **Scholarships**

  A limited number of ‘reduced tuition scholarships’ are available for this course. They are offered specifically to participants coming from countries with weaker currencies in relationship with the Euro/US$/AUD. It is up to you to identify if you think you are in need of a reduced price. If you are interested in this option please outline it in your letter of motivation.

  Please let us know if you need any specific certificate or letter of support in order to apply for some form of funding or grant.

language: |
  **LANGUAGE**  
  The workshop will be taught in ENGLISH and a basic understanding of this language is required.

travel: |
  The program will be less than 90 days, so citizens from many nationalities can enter ITALY and the EU without a VISA. You can check online on this web site for the requirements for your country: [http://vistoperitalia.esteri.it/](https://vistoperitalia.esteri.it/)  
  If you come from a country for which a VISA is required, please contact us and we will provide a certificate of enrollment for the VISA application.

  The last four editions of The Red Nose Intensive in Padova in 2022, 2023 and 2024 have gathered participants from Australia, Belgium, Brasil, Canada, Estonia, Finland, Germany, Italy, Malaysia, Norway, South Africa, Switzerland, Turkey, the UK and the United States.

accommodation: |
  Please note that the tuition does not include accommodation and that participants will be responsible for organizing their staying in Padova.

  Here is a list of useful information and contacts on how to organize your staying in Padova : **[WELCOME TO PADOVA](/wp-content/uploads/2026/05/welcome.to_.padova.2026.pdf)**.

applications: |
  There is no application form.  
  To apply to **THE RED NOSE INTENSIVE,** please email

  – ***a short bio***, including a recent photograph

  – ***a letter of motivation*** sharing the essence of your story, vision, dream, desire, fear or inexplicable intuition that leads you to this training.

  Please include in your letter  
  \-how did you come to know about this work;  
  \-your experience with movement based theatre;  
  \-your previous experience with clown;  
  \-for what purpose you apply to this program;  
  \-some notes about your personal journey in terms of healing or therapeutic practices, or other relevant inner experiences;  
  – anything about your physical or emotional state that you feel it is important for the teacher to know (ex: injuries or preexisting physical conditions; specific physical or emotional needs; psychological states, diagnosed or un-diagnosed).

  If you are thinking about asking AI to write for you… please read [**this note**](/wp-content/uploads/2026/09/a-note-about-ai.pdf) first.

  Before applying please read [**this document**](/wp-content/uploads/2026/05/rules-of-engagement-red-nose-2026-1.pdf) about **the rules of engagement** of the participants with the workshop: with oneself, with the group, with the teacher and with the work.

  Please send your application to [**giovanni.fusetti@helikos.com**](mailto:giovanni.fusetti@helikos.com)

  Giovanni will contact you after receiving the application.

  Giovanni will select the students among the applications received, forming the group.

  If the applicant has not previously worked with Giovanni, he will ask them to meet online for an orientation interview.

  The first selection will happen on **June 15th.**

  Once Giovanni has selected **12 students**, the training is full, and a waiting list will be created.

  Once accepted, in order to confirm the enrollment, a **deposit** of EURO 700 is due.

  Please note that the deposit is **non-refundable**, except in the case of cancellation of the training due to reasons of *force-majeure*.

  The remaining part of the tuition is due by August 1st, 2026.

  Enrollment situation as of September 1st 2026: the training is **fully booked** and a waiting list is in place.

  For further information about the content of the workshop  
  and for application and practical inquiries, please contact Giovanni Fusetti at

  **[giovanni.fusetti@helikos.com](mailto:giovanni.fusetti@helikos.com)**

  See you in Padova !

