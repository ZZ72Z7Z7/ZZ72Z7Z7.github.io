tuition_it: |-
  **QUOTA EARLY BIRD**  
  Scala mobile da 850 AUD a 1.000 AUD: se il pagamento completo è effettuato entro il 15 gennaio 2027

  La quota segue un approccio a **scala mobile**. La scala mobile vuole riconoscere il fatto che il “valore” del denaro può cambiare molto a seconda di molti fattori. Partecipanti con provenienze diverse possono avere un diverso accesso al reddito o al sostegno economico. In una formazione internazionale, partecipanti diversi avranno anche costi di viaggio molto diversi.

  Se potete e volete pagare la parte alta della scala, sosterrete il campo collettivo della pratica e la diversità sociale e culturale della classe, oltre a finanziare il nostro lavoro e la nostra ricerca pedagogica in corso. Indicate nella vostra candidatura l’importo che scegliete di pagare.

  **QUOTA INTERA**  
  AUD 1.100: se il pagamento completo è effettuato dopo il 15 gennaio 2027

  I partecipanti a *Famiglia dell’Arte 2027* che, dopo la fine del workshop, vogliano candidarsi a questo workshop avanzato potranno comunque iscriversi con la tariffa early bird, se ci sono ancora posti disponibili.

  **QUOTA RIDOTTA**

  È disponibile un numero limitato di posti a **quota ridotta**. Contattateci se siete interessati.

  Tenete presente che in caso di rinuncia da parte del partecipante iscritto, l’acconto è NON RIMBORSABILE.

  Il **numero massimo di partecipanti è 12.**  
  Una volta assegnati i 12 posti, verrà creata una lista d’attesa, nel caso si liberasse un posto.

  **Situazione delle iscrizioni al 10 settembre**: le candidature sono aperte e ci sono posti disponibili

accommodation_it: |-
  Tenete presente che la quota non include vitto e alloggio e che i partecipanti dovranno occuparsi di organizzare il proprio soggiorno a Melbourne.

applications_it: |-
  Per candidarvi al workshop inviate via email una lettera di motivazione (in inglese) a Giovanni e Zsófi a **[kairosplay@protonmail.com](mailto:kairosplay@protonmail.com)** in cui condividete ciò che vi porta a tornare a questo lavoro.

  Indicate nella lettera quale è stata l’essenza della vostra esperienza nei workshop precedenti con Zsófi e Giovanni e quali temi specifici della vostra vita vorreste portare in questo nuovo workshop.

  Prima di candidarvi leggete il documento **[The Rules of Engagement](/wp-content/uploads/2026/09/rules-of-engagement.advanced-mel-3.pdf)**, che trovate cliccandoci sopra. Contiene:  
  – le regole di ingaggio dei partecipanti con il workshop: con sé stessi, con il gruppo, con l’insegnante e con il lavoro;  
  – le linee guida su cosa includere nella lettera di motivazione;  
  – la nostra politica di cancellazione e rimborso.

  Iscrivendovi al workshop accettate le nostre Regole di Ingaggio.

  È previsto un contributo di candidatura non rimborsabile di AUD20, da inviare tramite [**questo link di pagamento**](https://wise.com/pay/r/z-lmuUp_te4HfoU) sulla piattaforma di pagamento WISE.

  Includete nella candidatura la ricevuta/lo screenshot del pagamento.  
  Ricevuta la candidatura, in alcuni casi i facilitatori del workshop potrebbero contattare il candidato con qualche ulteriore domanda e/o richiedere un colloquio online.

  Una volta accettata la candidatura, i candidati possono confermare l’iscrizione inviando **AUD 400** come **acconto non rimborsabile**.

  Per ulteriori informazioni sul contenuto del workshop potete contattare

  **Zsófi Kigyóssy** e **Giovanni Fusetti** a

  **[kairosplay@protonmail.com](mailto:kairosplay@protonmail.com)**

