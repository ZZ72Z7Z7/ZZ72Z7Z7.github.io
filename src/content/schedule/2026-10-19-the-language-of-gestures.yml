schedule: |
  Monday October 19th to Saturday October 24th  
  **9h30 to 17h daily**  
  with 1 hour lunch break and morning/afternoon coffee breaks

location_details: |
  HELIKOS STUDIO  
  Via Monte Solarolo 16/A  
  PADOVA, ITALY

tuition: |
  **Early Bird Tuition**: € 600.00, if tuition is paid by August 1st, 2026.

  **Full Tuition**: € 680.00, if tuition is paid after August 1st, 2026.

  Once accepted, to confirm the enrollment, a **deposit** of € 300 is due.

  Please note that the deposit is strictly **non-refundable.** Once the application is accepted, spots in the class will be given in the order the application was received.

  The remaining part of the tuition is due by September 1st.

  Please note the workshop is a **learning continuum**, so it is not possible to attend the class only in parts, or to miss any session of the work.

  Once completed the enrollment, two weeks before the beginning of the workshop, participants will receive a message containing further practical details about the workshop.

  **Scholarships**

  A limited number of *‘reduced tuition scholarships’* are available for this course. It is up to you to identify if you think you are in need of a reduced price. If you are interested in taking advantage of this option please outline it in your letter of motivation.

language: |
  **LANGUAGE**  
  The workshop will be taught in ENGLISH and a basic understanding of this language is required.

accommodation: |
  Please note that the tuition does not include accommodation and that participants will be responsible for organizing their staying in Padova.

  Here is a list of useful information and contacts on how to organize your staying in Padova : **[WELCOME TO PADOVA](/wp-content/uploads/2026/05/welcome.to_.padova.2026.pdf)**.

applications: |
  There is no application form. To apply to the workshop please email a **letter of motivation** sharing the essence of your story, vision, dream, desire, fear or inexplicable intuition that leads you to this work. Please include in your letter:

  - your experience with movement based theatre;
  - your experience with the pedagogy of Jacques Lecoq;
  - anything about your physical or emotional state that you feel it is important for the teacher to know (ex: injuries or preexisting physical conditions; specific physical or emotional needs; psychological states, diagnosed or un-diagnosed).

  If you are thinking about asking AI to write for you… please read [**this note**](/wp-content/uploads/2026/09/a-note-about-ai.pdf) first.

  Before applying please read **[this document](/wp-content/uploads/2026/05/rules-of-engagement.log_.padova.2026.pdf)** about **the rules of engagement** of the participants with the workshop: with oneself, with the group, with the teacher and with the work.

  Giovanni will contact you after receiving the application. Once **16 students** have been selected, the workshop is full, and a waiting list will be created. If you intend to participate, we encourage you to apply as soon as possible.

  Please send your application to **[giovanni.fusetti@helikos.com](mailto:giovanni.fusetti@helikos.com)**

schedule_it: |-
  Da lunedì 19 ottobre a sabato 24 ottobre  
  **Dalle 9h30 alle 17h ogni giorno**  
  con 1 ora di pausa pranzo e pause caffè al mattino e al pomeriggio

location_details_it: |-
  HELIKOS STUDIO  
  Via Monte Solarolo 16/A  
  PADOVA, ITALIA

tuition_it: |-
  **Quota Early Bird**: € 600.00, se la quota è versata entro il 1° agosto 2026.

  **Quota intera**: € 680.00, se la quota è versata dopo il 1° agosto 2026.

  Una volta accettati, per confermare l’iscrizione è dovuto un **acconto** di € 300.

  Tenete presente che l’acconto è assolutamente **non rimborsabile.** Una volta accettata la candidatura, i posti nella classe saranno assegnati nell’ordine in cui le candidature sono state ricevute.

  Il resto della quota è dovuto entro il 1° settembre.

  Tenete presente che il workshop è un **continuum di apprendimento**, quindi non è possibile frequentare il corso solo in parte, né perdere alcuna sessione del lavoro.

  Una volta completata l’iscrizione, due settimane prima dell’inizio del workshop, i partecipanti riceveranno un messaggio con ulteriori dettagli pratici sul workshop.

  **Borse di studio**

  Per questo corso è disponibile un numero limitato di *‘borse di studio a quota ridotta’*. Spetta a voi valutare se pensate di avere bisogno di un prezzo ridotto. Se siete interessati a questa opzione, indicatelo nella vostra lettera di motivazione.

language_it: |-
  **LINGUA**  
  Il workshop sarà tenuto in INGLESE ed è richiesta una conoscenza di base di questa lingua.

accommodation_it: |-
  Tenete presente che la quota non include l’alloggio e che i partecipanti dovranno occuparsi di organizzare il proprio soggiorno a Padova.

  Ecco un elenco di informazioni e contatti utili su come organizzare il vostro soggiorno a Padova : **[WELCOME TO PADOVA](/wp-content/uploads/2026/05/welcome.to_.padova.2026.pdf)**.

applications_it: |-
  Non c’è un modulo di iscrizione. Per candidarvi al workshop inviate via email una **lettera di motivazione** in cui condividete l’essenza della vostra storia, visione, sogno, desiderio, paura o inspiegabile intuizione che vi porta a questo lavoro. Includete nella lettera:

  - la vostra esperienza con il teatro di movimento;
  - la vostra esperienza con la pedagogia di Jacques Lecoq;
  - tutto ciò che riguarda il vostro stato fisico o emotivo che ritenete importante che l’insegnante sappia (ad es.: infortuni o condizioni fisiche preesistenti; specifiche necessità fisiche o emotive; stati psicologici, diagnosticati o non diagnosticati).

  Se state pensando di chiedere all’AI di scrivere per voi… leggete prima [**questa nota**](/wp-content/uploads/2026/09/a-note-about-ai.pdf).

  Prima di candidarvi leggete **[questo documento](/wp-content/uploads/2026/05/rules-of-engagement.log_.padova.2026.pdf)** sulle **regole di ingaggio** dei partecipanti con il workshop: con sé stessi, con il gruppo, con l’insegnante e con il lavoro.

  Giovanni vi contatterà dopo aver ricevuto la candidatura. Una volta selezionati **16 studenti**, il workshop è al completo e verrà creata una lista d’attesa. Se intendete partecipare, vi invitiamo a candidarvi il prima possibile.

  Inviate la vostra candidatura a **[giovanni.fusetti@helikos.com](mailto:giovanni.fusetti@helikos.com)**

