schedule: |
  **October 19 - 24, 2026**  
  9h30 to 17h daily

  (1 hour lunch; morning/afternoon coffee breaks)

location_details: |
  **HELIKOS STUDIO**  
  Via Monte Solarolo 16/A  
  PADOVA, ITALY

tuition: |
  **EARLY BIRD**\
  €600.00 *if paid by August 1st, 2026*

  **FULL PRICE**\
  €680.00 *if paid after August 1st, 2026*

  Once accepted, a deposit of € 300 is required to confirm enrollment. **This deposit is strictly non-refundable.**

  The remaining part of the tuition is due by **September 1st.**

  Spots will be offered according to the order in which applications are received.

  The workshop is a **learning continuum** and partial attendance is not permitted.

  **SCHOLARSHIPS**

  A limited number of *‘reduced tuition scholarships’* are available for this course. It is up to you to identify if you think you are in need of a reduced price. If you are interested in taking advantage of this option please outline it in your letter of motivation.

language: |
  The workshop will be taught in ENGLISH and a basic understanding of this language is required.

accommodation: |
  Please note that the tuition does not include accommodation and that participants will be responsible for organizing their staying in Padova.

  Here is a list of useful information and contacts on how to organize your staying in Padova : **[WELCOME TO PADOVA](/wp-content/uploads/2026/05/welcome.to_.padova.2026.pdf)**.

applications: |
  There is no application form. To apply, please email a **letter of motivation** sharing the essence of your story, vision, dream, desire, fear or inexplicable intuition that leads you to this work.

  Please describe:

  - your experience with movement based theatre;
  - your experience with the pedagogy of Jacques Lecoq;
  - anything about your physical or emotional state that you feel it is important for the teacher to know (ex: injuries or preexisting physical conditions; specific physical or emotional needs; psychological states, diagnosed or un-diagnosed).

  Before applying, please review the workshop [rules of engagement](/wp-content/uploads/2026/05/rules-of-engagement.log_.padova.2026.pdf).\
  And if you are thinking about asking AI to write for you… please read [this note](/wp-content/uploads/2026/09/a-note-about-ai.pdf) first.\
  Giovanni will contact you after receiving your application. Once **16 students** have been selected, the workshop is full, and a waiting list will be created. If you intend to participate, we encourage you to apply as soon as possible.

  Please send your application to [giovanni.fusetti@helikos.com](mailto:giovanni.fusetti@helikos.com)

schedule_it: |-
  **19 - 24 ottobre 2026**\
  Dalle 9h30 alle 17h ogni giorno

  (1 ora di pausa pranzo; pause caffè al mattino e al pomeriggio)

location_details_it: |-
  **HELIKOS STUDIO**\
  Via Monte Solarolo 16/A\
  PADOVA, ITALIA

tuition_it: |-
  **EARLY BIRD**\
  €600,00 *se versata entro il 1° agosto 2026*

  **FULL PRICE**\
  €680,00 *se versata dopo il 1° agosto 2026*

  Una volta accettati, per confermare l’iscrizione è richiesto un acconto di € 300. **Questo acconto è assolutamente non rimborsabile.**

  Il resto della quota è dovuto entro il **1° settembre.**

  I posti saranno assegnati nell’ordine in cui le candidature vengono ricevute.

  Il workshop è un **continuum di apprendimento** e non è consentita la frequenza parziale.

  **BORSE DI STUDIO**

  Per questo corso è disponibile un numero limitato di *‘borse di studio a quota ridotta’*. Spetta a voi valutare se pensate di avere bisogno di un prezzo ridotto. Se siete interessati a questa opzione, indicatelo nella vostra lettera di motivazione.

language_it: |-
  Il workshop sarà tenuto in INGLESE ed è richiesta una conoscenza di base di questa lingua.

accommodation_it: |-
  Tenete presente che la quota non include l’alloggio e che i partecipanti dovranno occuparsi di organizzare il proprio soggiorno a Padova.

  Ecco un elenco di informazioni e contatti utili su come organizzare il vostro soggiorno a Padova : **[WELCOME TO PADOVA](/wp-content/uploads/2026/05/welcome.to_.padova.2026.pdf)**.

applications_it: |-
  Non c’è un modulo di iscrizione. Per candidarvi, inviate via email una **lettera di motivazione** in cui condividete l’essenza della vostra storia, visione, sogno, desiderio, paura o inspiegabile intuizione che vi porta a questo lavoro.

  Descrivete:

  - la vostra esperienza con il teatro di movimento;
  - la vostra esperienza con la pedagogia di Jacques Lecoq;
  - tutto ciò che riguarda il vostro stato fisico o emotivo che ritenete importante che l’insegnante sappia (ad es.: infortuni o condizioni fisiche preesistenti; specifiche necessità fisiche o emotive; stati psicologici, diagnosticati o non diagnosticati).

  Prima di candidarvi, leggete le [regole di ingaggio](/wp-content/uploads/2026/05/rules-of-engagement.log_.padova.2026.pdf) del workshop.\
  E se state pensando di chiedere all’AI di scrivere per voi… leggete prima [questa nota](/wp-content/uploads/2026/09/a-note-about-ai.pdf).\
  Giovanni vi contatterà dopo aver ricevuto la vostra candidatura. Una volta selezionati **16 studenti**, il workshop è al completo e verrà creata una lista d’attesa. Se intendete partecipare, vi invitiamo a candidarvi il prima possibile.

  Inviate la vostra candidatura a [giovanni.fusetti@helikos.com](mailto:giovanni.fusetti@helikos.com)

