tuition_it: |-
  <br>
  **Quota Early Bird**: AUD$ 3.200. Se la quota completa è pagata entro il 31 ottobre 2026  
  **Quota intera**: AUD 3.800. Se la quota completa è pagata tra il 31 ottobre e il 1° dicembre 2026  
  **Late Bird:** AUD 4.200. Se la quota completa è pagata dopo il 1° dicembre 2026

  Una volta accettati, per confermare l’iscrizione è dovuto un **acconto** di AUD 1.000.  
  Tenete presente che l’acconto è **non rimborsabile**, tranne in caso di annullamento del workshop per *forza maggiore*.  
  <br>
  Tenete presente che la quota non include l’alloggio e che i partecipanti dovranno occuparsi di organizzare il proprio soggiorno a Melbourne.

  È disponibile un numero limitato di borse di studio sotto forma di quota ridotta.  
  <br>
  Una volta completata l’iscrizione, i partecipanti riceveranno un messaggio con ulteriori dettagli pratici sul workshop.
applications_it: |-
  Non c’è un modulo di iscrizione.  
  Per candidarvi al workshop inviate via email **una breve biografia** e **una lettera di** **motivazione**, in cui condividete l’essenza della vostra storia, visione, sogno, desiderio, paura o inspiegabile intuizione che vi porta a questo lavoro. Includete nella lettera  
  – la vostra esperienza con il teatro di movimento;  
  – la vostra esperienza con la pedagogia di Jacques Lecoq;  
  – la vostra esperienza con i Bouffon;  
  – tutto ciò che riguarda il vostro stato fisico o emotivo che ritenete importante che l’insegnante sappia (ad es.: infortuni o condizioni fisiche preesistenti; specifiche necessità fisiche o emotive; stati psicologici, diagnosticati o non diagnosticati).  
  <br>
  Sarà data priorità ai candidati che hanno già sperimentato il lavoro sul Bouffon con Giovanni Fusetti o Kimberley Twiner.

  Prima di candidarvi leggete **[le regole di ingaggio](/wp-content/uploads/2026/09/rules-of-engagement-2027.pdf)** dei partecipanti con il workshop: con sé stessi, con il gruppo, con l’insegnante e con il lavoro.  
  <br>
  Se state pensando di chiedere all’AI di scrivere per voi… leggete prima [](/wp-content/uploads/2026/07/a-note-about-ai-1.pdf)[**questa nota**](/wp-content/uploads/2026/09/a-note-about-ai.pdf).

  Giovanni vi contatterà dopo aver ricevuto la candidatura.  
  **La prima selezione avverrà il 1° ottobre 2026.**  
  <br>
  Una volta accettata la candidatura, i posti saranno assegnati in ordine di invio dell’email.

  Una volta che Giovanni avrà selezionato **18 studenti**, il workshop è al completo e verrà creata una lista d’attesa.

  Se intendete partecipare, vi invitiamo a candidarvi il prima possibile.  

  Inviate la vostra candidatura a **[giovanni.fusetti@helikos.com](mailto:giovanni.fusetti@helikos.com)**

  ![](/wp-content/uploads/2021/04/bouf.pax_.group_.jpg)  
  Bouffon Performance at *Dell’Arte School , 2007*  

  **INFORMAZIONI E CANDIDATURE**  
  <br>
