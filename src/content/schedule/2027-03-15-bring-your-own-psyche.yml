tuition: |
  **EARLY BIRD TUITION**  
  Sliding Scale 850 AUD to 1.000 AUD: if full payment is made before January 15th, 2027

  The tuition is following a **sliding scale** approach. The sliding scale wants to acknowledge the fact that the “value” of money can change widely depending on many factors. Participants from different backgrounds, may have different access to income or to financial support. In an international training, different participants will also have very different travel costs.

  If you can and want to pay on the higher end of the scale, you will be supporting the collective field of practice and the social and cultural diversity of the class, as well as funding our work and our ongoing pedagogic research. Please indicate in your application the amount that you choose to pay.

  **FULL PRICE**  
  AUD 1.100: if full payment is made after January 15th, 2027

  Participants to the *Famiglia dell’Arte 2027* who, after the end of the workshop, want to apply to this advanced workshop will still be able to the enroll with the early bird rate, if there are still spots available.

  **REDUCED TUITION**

  A limited number of spots are available at a **reduced tuition**. Please contact us if you are interested.

  Please note that in case of cancellation by the enrolled participant, the deposit is NON-REFUNDABLE.

  The **maximum number of participants is 12.**  
  Once the 12 places will be assigned, a waiting list will be set up, in case a spot will become available.

  **Enrollment situation as of September 10th**: applications are open and there are spots available

accommodation: |
  Please note that the tuition does not include food and accommodation and that participants will be responsible for organizing their staying in Melbourne. 

applications: |
  To apply to the workshop please e-mail a letter of motivation (in English) to Giovanni and Zsófi at **[kairosplay@protonmail.com](mailto:kairosplay@protonmail.com)** sharing what brings you to return to this work.

  Please mention in your letter what was the essence of your experience in the previous workshop(s) with Zsófi and Giovanni and what specific theme(s) of your life you would like to bring to this new workshop.

  Before applying please read the document **[The Rules of Engagement](/wp-content/uploads/2026/09/rules-of-engagement.advanced-mel-3.pdf)**, that you can find clicking on it. It contains:  
  – the rules of engagement of the participants with the workshop: with oneself, with the group, with the teacher and with the work;  
  – the guidelines on what to include in the motivation letter;  
  – our cancellation and refund policy.

  By enrolling in the workshop you agree with our Rules of Engagement.

  There is a non-refundable application fee of AUD20, to send using [**this payment link**](https://wise.com/pay/r/z-lmuUp_te4HfoU) on the payment platform WISE.

  Please include in the application the receipt/screenshot of your payment.  
  Once the application is received, in some cases the workshop facilitators might contact the applicant with some further questions, and/or request an online conversation.

  Once the application is accepted, applicants can confirm their enrollment by sending **AUD 400** as **non-refundable deposit**.

  For further information about the content of the workshop you can contact

  **Zsófi Kigyóssy** and **Giovanni Fusetti** at

  **[kairosplay@protonmail.com](mailto:kairosplay@protonmail.com)**

