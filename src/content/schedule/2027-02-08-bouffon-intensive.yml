schedule: |
  The workshop is an intensive four week Masterclass, from Monday February 1st to Sunday February 27th, with the following schedule:

  **Week one**: Monday 8th to Friday 1th, 9:30am to 5:00 pm  
  *Saturday 13th and Sunday 14th: Days Off*  
  **Week two**: Monday 15th to Friday 19th: 9:30am to 5:00 pm  
  *Saturday 20th and Sunday 21st: Days Off*  
  **Week three**: Monday 22nd to Wednesday 24th: 9:30am to 5:00 pm  
  Thursday 25th: 12:00pm to 10:00pm.  
  7:00pm: **FIRST PUBLIC PERFORMANCE** of a Work-in-progress showcase.  
  Friday 26th: 9:30am to 5:00 pm  
  *Saturday 27th and Sunday 28th: Days off*  
  **Week four**: Monday 1st to Wednesday 3rd: 9:30am to 5:00 pm  
  Thursday 4th & Friday 5th & Saturday 6th: 12:00pm to 10:00pm. **PUBLIC PERFORMANCES** of the pieces developed from the first work in progress.

  Sunday 7th 11:00 am to 10:00 pm: completion day and final Party  

  ![](/wp-content/uploads/2022/04/barn.2016.duo_.jpg)  
  Bouffon Training at the Celebration Barn Theatre, USA, 2017  

  **LANGUAGE**  
  The workshop will be taught in ENGLISH and a basic understanding of this language is required.

  ![](/wp-content/uploads/2021/04/bouf.heli_.ban_.1.jpg)  
  *Helikos School, 2013*

location_details: |
  **Helikos Downunder Summer School 2027**

  Pascoe Vale Uniting Church  
  10 Cumberland Rd, Pascoe Vale South VIC 3044, Australia  
  [**Directions**](https://maps.app.goo.gl/s9EWQ9phEC9Dg5FeA)

tuition: |
  <br>
  **Early Bird Tuition**: AUD$ 3.200. If full tuition is paid by October 31st, 2026  
  **Full Tuition**: AUD 3.800. If full tuition is paid between October 31st and December 1st, 2026  
  **Late Bird:** AUD 4.200. If full tuition is paid after December 1st, 2026

  Once accepted, to confirm the enrollment, a **deposit** of AUD 1.000 is due.  
  Please note that the deposit is **non-refundable**, unless in case of cancellation of the workshop due to *force majeure*.  
  <br>
  Please note that the tuition does not include accommodation and that participants will be responsible for organizing their staying in Melbourne.

  A limited number of scholarships are available in the form of a reduced tuition.  
  <br>
  Once completed the enrollment, participants will receive a message containing further practical details about the workshop.

applications: |
  There is no application form.  
  To apply to the workshop please email **a brief bio**, and **a letter of** **motivation**, sharing the essence of your story, vision, dream, desire, fear or inexplicable intuition that leads you to this work. Please include in your letter  
  – your experience with movement based theatre;  
  – your experience with the pedagogy of Jacques Lecoq;  
  – your experience with Bouffons;  
  – anything about your physical or emotional state that you feel it is important for the teacher to know (ex: injuries or pre-existing physical conditions; specific physical or emotional needs; psychological states, diagnosed or undiagnosed).  
  <br>
  Priority will be given to applicants who have already experienced the Bouffon work with Giovanni Fusetti or Kimberley Twiner.

  Before applying please read **[the rules of engagement](/wp-content/uploads/2026/09/rules-of-engagement-2027.pdf)** of the participants with the workshop: with oneself, with the group, with the teacher and with the work.  
  <br>
  If you are thinking about asking AI to write for you… please read [](/wp-content/uploads/2026/07/a-note-about-ai-1.pdf)[**this note**](/wp-content/uploads/2026/09/a-note-about-ai.pdf) first.

  Giovanni will contact you after receiving the application.  
  **The first selection will happen on October 1st, 2026.**  
  <br>
  Once the application is accepted, places will be given in order of email submission.

  Once Giovanni has selected **18 students**, the workshop is full, and a waiting list will be created.

  If you intend to participate, we encourage you to apply as soon as possible.  

  Please send your application to **[giovanni.fusetti@helikos.com](mailto:giovanni.fusetti@helikos.com)**

  ![](/wp-content/uploads/2021/04/bouf.pax_.group_.jpg)  
  Bouffon Performance at *Dell’Arte School , 2007*  

  **INFORMATION AND APPLICATIONS**  
  <br>
  For further information about the content of the workshop  
  and for APPLICATIONS, please contact Giovanni Fusetti at

  **[giovanni.fusetti@helikos.com](mailto:giovanni.fusetti@helikos.com)**

  For enrollment and practical enquiries please contact
schedule_it: |-
